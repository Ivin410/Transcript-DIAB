<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Transcript Builder</title>
<style>
:root{
  --paper:#EEF1F0; --surface:#FFFFFF; --ink:#16222E; --ink-2:#2C3B49; --muted:#5B6975; --line:#D3DAD9; --line-2:#E6EAE9;
  --data:#1F6F4A; --data-bg:#E2F1E8; --data-line:#A9D3BC;
  --place:#234FA8; --place-bg:#E3EAFA; --place-line:#A9BCEA;
  --warn:#9A5B00; --warn-bg:#FBF0DA; --err:#AE2A1F; --err-bg:#FBE7E4;
  --display:"Bahnschrift","DIN Alternate","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--place);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--ink);color:#DCE4E9;padding:22px 0 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{font:600 21px/1.1 var(--display);letter-spacing:.3px;color:#fff;padding:0 22px 4px}
.brand-sub{padding:0 22px 20px;color:#93A3AF;font-size:12.5px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:30px 1fr;gap:2px 10px;width:100%;padding:12px 22px 12px 19px;border-left:3px solid transparent;cursor:pointer}
.steps button:hover{background:#1D2C3A}
.steps button:focus-visible{outline:2px solid #9DB7F5;outline-offset:-2px}
.steps button[aria-current="step"]{background:#22323F;border-left-color:#fff}
.steps .n{grid-row:span 2;font:600 22px/1 var(--display);color:#7F909D;padding-top:1px}
.steps button[aria-current="step"] .n{color:#fff}
.steps .t{font:600 15px/1.2 var(--display);letter-spacing:.3px;color:#fff}
.steps .s{font-size:12px;color:#93A3AF;line-height:1.35}
.steps .s.ok{color:#8FD3AE}.steps .s.todo{color:#F0C36D}
.rail .private{margin:auto 22px 0;font-size:12px;color:#93A3AF;line-height:1.45;border-top:1px solid #2B3B49;padding-top:14px}

main{padding:30px 38px 60px;min-width:0}
h1{font:600 31px/1.1 var(--display);letter-spacing:.2px;margin:0 0 6px}
h2{font:600 18px/1.2 var(--display);letter-spacing:.2px;margin:0 0 4px}
.lede{color:var(--muted);max-width:74ch;margin:0 0 22px;font-size:15px}
.note{color:var(--muted);font-size:13px;margin:2px 0 10px;max-width:80ch}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#9AA7AE}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--ink-2)}
.btn.data{background:var(--data);border-color:var(--data);color:#fff}
.btn.doc{background:var(--place);border-color:var(--place);color:#fff}
.btn.small{padding:3px 10px;font-size:12.5px;font-weight:500}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{all:unset;color:var(--place);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
input[type=text],input[type=number],input[type=search],select{border:1px solid var(--line);border-radius:6px;background:#fff;padding:5px 8px;min-width:0}
select{max-width:100%}

.drop{border:1.5px dashed #9FB0AD;border-radius:10px;background:#F7F9F8;padding:26px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;transition:background .15s,border-color .15s}
.drop.over{background:var(--data-bg);border-color:var(--data)}
.drop.doc.over{background:var(--place-bg);border-color:var(--place)}
.drop .big{font:600 19px/1.2 var(--display)}
.drop .sub{color:var(--muted);font-size:13px}
.files{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.file{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--data-line);background:var(--data-bg);border-radius:999px;padding:3px 6px 3px 12px;font-size:13px}
.file.doc{border-color:var(--place-line);background:var(--place-bg)}
.file button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;text-align:center;line-height:19px;color:var(--muted)}
.file button:hover{background:#fff;color:var(--err)}

.sources{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px;margin:18px 0 0;align-items:start}
.from{font-size:12.5px;color:var(--muted);margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheets{overflow:auto;margin-top:8px}
.sheets table{border-collapse:collapse;width:100%;font-size:13.5px}
.sheets th{text-align:left;font-weight:600;color:var(--muted);padding:8px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.sheets td{padding:7px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.sheets tr:last-child td{border-bottom:0}
.sheets tr.on td:first-child{box-shadow:inset 3px 0 0 var(--data)}
.sheets tr:not(.on) td:first-child b{font-weight:400;color:var(--muted)}
.sheets td small{display:block;color:var(--muted);font-size:12px}
.sheets .num{text-align:right;font-variant-numeric:tabular-nums;width:90px}
.sheets select{min-width:260px}
.sheets tr:not(.on) select{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.src{border-top:3px solid var(--data);padding:14px 16px 12px}
.src.empty{border-top-color:#B9C3C2}
.src h2{margin-bottom:2px}
.src .state{font-size:13px;color:var(--data);font-weight:600;margin-bottom:10px}
.src.empty .state{color:var(--warn)}
.field{display:grid;grid-template-columns:128px minmax(0,1fr);align-items:center;gap:6px 10px;margin:5px 0;font-size:13px}
.field>span{color:var(--muted)}
.field select,.field input{width:100%}
.rule{margin:10px 0 4px;font-size:13px;color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--data-bg);border-color:var(--data);color:#124A30;font-weight:600}
details.cols{margin-top:12px;border-top:1px solid var(--line-2);padding-top:8px}
details.cols summary{cursor:pointer;color:var(--muted);font-size:13px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 16px}
.tabs button{all:unset;cursor:pointer;padding:9px 16px;font:600 15px/1 var(--display);letter-spacing:.2px;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs .count{font:600 12px var(--ui);background:var(--warn-bg);color:var(--warn);border-radius:999px;padding:1px 7px;margin-left:6px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.bar .grow{flex:1}
.stat{font-size:13.5px;color:var(--muted)}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}

.gridwrap{border:1px solid var(--line);border-radius:8px;background:#fff;overflow:auto;max-height:calc(100vh - 250px)}
table.grid{border-collapse:separate;border-spacing:0;font-size:12.5px;white-space:nowrap}
table.grid th,table.grid td{padding:5px 9px;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);text-align:left}
table.grid thead th{position:sticky;background:#F4F6F5;z-index:2;font-weight:600}
table.grid thead tr:first-child th{top:0;height:27px;font:600 13px/1 var(--display);letter-spacing:.2px;border-bottom:0}
table.grid thead tr:nth-child(2) th{top:27px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
table.grid th.g1,table.grid td.g1{background-image:linear-gradient(#F0F6F2,#F0F6F2)}
table.grid td.n{text-align:center;font-variant-numeric:tabular-nums}
table.grid td.none{color:#B7C0C4;text-align:center}
table.grid .stick{position:sticky;left:0;z-index:1;background:#fff;border-right:1px solid var(--line);min-width:200px}
table.grid thead .stick{z-index:3;background:#F4F6F5}
table.grid td.stick small{color:var(--muted);font-size:11.5px;margin-left:8px;font-variant-numeric:tabular-nums}
table.grid tbody tr:hover td{background-color:#F6F9FE}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:1px}

.rules{display:grid;gap:22px;max-width:1080px}
.rules section{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.rules table{border-collapse:collapse;font-size:13px;margin-top:8px}
.rules th{text-align:left;font-weight:600;color:var(--muted);padding:4px 14px 4px 0;border-bottom:1px solid var(--line)}
.rules td{padding:4px 14px 4px 0;border-bottom:1px solid var(--line-2);vertical-align:middle}
.rules td input[type=text]{width:190px}
.opt{display:flex;gap:9px;align-items:flex-start;margin:6px 0}
.opt input{margin-top:4px}
.opt small{display:block;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:26px}
.sentence{margin:4px 0;font-size:13.5px}
.tag{display:inline-block;background:var(--data-bg);border:1px solid var(--data-line);color:#124A30;border-radius:4px;padding:0 7px;font-size:12.5px;margin:1px 2px}
.tag.p{background:var(--place-bg);border-color:var(--place-line);color:#17367A}
.tag.x{background:#F1F3F3;border-color:var(--line);color:var(--muted)}

.checks{display:grid;gap:8px;max-width:980px}
.checks details{background:#fff;border:1px solid var(--line);border-radius:8px}
.checks summary{cursor:pointer;padding:11px 14px;display:flex;gap:10px;align-items:baseline;list-style:none}
.checks summary::-webkit-details-marker{display:none}
.checks summary .ct{font:600 15px var(--display);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.checks summary .tt{font-weight:600}
.sev{font-size:11.5px;font-weight:600;border-radius:4px;padding:1px 7px;margin-left:auto}
.sev.warn{background:var(--warn-bg);color:var(--warn)}.sev.error{background:var(--err-bg);color:var(--err)}.sev.info{background:#EEF1F0;color:var(--muted)}
.checks .body{padding:0 14px 12px 58px}
.checks .body p{margin:0 0 8px;color:var(--muted);font-size:13px;max-width:78ch}
.checks .body table{border-collapse:collapse;font-size:12.5px}
.checks .body td{padding:2px 16px 2px 0;border-bottom:1px solid var(--line-2)}
.checks .body td:first-child{font-variant-numeric:tabular-nums;color:var(--muted)}

.split{display:grid;grid-template-columns:minmax(400px,.85fr) minmax(480px,1fr);gap:20px;align-items:start}
.maplist{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.maprow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1.15fr);gap:4px 10px;padding:8px 12px;border-bottom:1px solid var(--line-2);align-items:center}
.maprow:last-child{border-bottom:0}
.maprow.hot{background:var(--place-bg)}
.maprow .no{font:600 13px var(--display);color:var(--place);text-align:right}
.maprow .where{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maprow .fname{font-size:13px;font-weight:600;color:#17367A;overflow-wrap:anywhere}
.maprow select{width:100%;border-color:var(--data-line);background:#F6FBF8}
.maprow select.unset{border-color:#E0B25B;background:var(--warn-bg)}
.maprow input[type=text]{width:100%;margin-top:4px}
.maprow .val{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.maprow .val b{color:var(--ink);font-weight:600}
.banner{border-radius:8px;padding:9px 14px;margin:0 0 12px;font-size:13px;background:var(--warn-bg);color:#5E3A00;border:1px solid #EBD3A0}

.pv{position:sticky;top:14px}
.pv-bar{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.seg button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.pv-scroll{background:#DDE2E1;border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto;max-height:calc(100vh - 150px)}
.page{background:#fff;width:100%;max-width:690px;min-width:520px;margin:0 auto;padding:26px 40px 30px;box-shadow:0 1px 2px rgba(22,34,46,.18),0 8px 24px rgba(22,34,46,.10);font:10pt/1.35 Calibri,Carlito,"Segoe UI",Arial,sans-serif;color:#111}
.dx-head,.dx-foot{text-align:center}
.dx-foot{margin-top:18px;font-size:8pt;color:#333}
.dx-p{margin:0 0 3px;min-height:1em}
.dx-li{padding-left:18px;position:relative}.dx-li::before{content:"•";position:absolute;left:4px}
.dx-t{border-collapse:collapse;width:100%;margin:8px 0 12px;table-layout:fixed}
.dx-t td{border:1px solid #8E979C;padding:3px 6px;vertical-align:top;overflow-wrap:anywhere}
.dx-img{max-width:100%;height:auto;vertical-align:middle}
.dx-box{display:inline-block;vertical-align:top;margin:4px 14px 4px 0;text-align:left}
.dx-tab{display:inline-block;width:2em}
mark.pl{background:var(--place-bg);color:#17367A;border-radius:3px;padding:0 3px;box-shadow:inset 0 0 0 1px var(--place-line);cursor:pointer;font-weight:600}
mark.pl.v{background:#EDF6F0;color:inherit;box-shadow:inset 0 -2px 0 var(--data-line);font-weight:inherit;cursor:default}
mark.pl.empty{background:var(--warn-bg);box-shadow:inset 0 0 0 1px #E0B25B;color:var(--warn);font-weight:400}
mark.pl.hot{background:var(--place);color:#fff}

.gen{display:grid;grid-template-columns:360px minmax(0,1fr);gap:20px;align-items:start}
.people{background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;max-height:calc(100vh - 150px);position:sticky;top:14px}
.people .top{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.people .top .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.people .top input[type=search]{flex:1 1 120px;min-width:0}
.people .top select{flex:0 0 108px;width:108px}
.people ul{list-style:none;margin:0;padding:0;overflow:auto}
.people li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line-2);cursor:pointer;font-size:13px}
.people li.cur{background:var(--place-bg)}
.people li small{color:var(--muted);font-variant-numeric:tabular-nums}
.out{background:#fff;border:1px solid var(--line);border-top:3px solid var(--place);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.out .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.out label{display:inline-flex;gap:7px;align-items:center}
.progress{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:var(--place);transition:width .2s}
.done{margin-top:10px;font-size:13.5px;color:var(--data);font-weight:600}
.empty-state{background:#fff;border:1px dashed #9FB0AD;border-radius:10px;padding:26px;max-width:640px;color:var(--muted)}
.empty-state b{color:var(--ink)}
.toast{position:fixed;right:20px;bottom:20px;background:var(--err);color:#fff;padding:11px 16px;border-radius:8px;max-width:440px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);z-index:50}
.busy{position:fixed;inset:0;background:rgba(238,241,240,.72);display:grid;place-items:center;z-index:40;font:600 18px var(--display)}

@media (max-width:1100px){.sources{grid-template-columns:1fr}.split,.gen{grid-template-columns:1fr}.pv,.people{position:static}.people{max-height:320px}}
@media (max-width:820px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;padding-bottom:8px}.steps{display:grid;grid-template-columns:repeat(4,1fr)}.steps button{grid-template-columns:1fr;padding:10px 12px;border-left:0;border-bottom:3px solid transparent}.steps button[aria-current="step"]{border-bottom-color:#fff}.steps .n{grid-row:auto}.steps .s,.rail .private,.brand-sub{display:none}main{padding:20px 16px 50px}.page{width:auto;padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.toast.ok{background:var(--data)}
.pick{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.chip .cnt{color:var(--muted);font-weight:400;margin-left:3px}
.dim{color:var(--muted)} small.dim{display:block;font-size:11.5px}
.tag.w{background:var(--warn-bg);border-color:#E0B25B;color:var(--warn)}
.field.wide{grid-template-columns:120px minmax(0,1fr);max-width:none}
.sumrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:8px;margin:6px 0}
.sumrow input,.sumrow select{width:100%}
.maplist.flat{border:0;border-radius:0}.maplist.flat .maprow{grid-template-columns:0 minmax(0,.8fr) minmax(0,1.2fr);padding:8px 0}
.rules td small.dim{margin-top:1px}
.editor{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.editor summary{cursor:pointer;padding:10px 14px;font-weight:600}
.editor[open]{padding-bottom:12px}.editor[open] summary{border-bottom:1px solid var(--line-2);margin-bottom:8px}
.editor table{border-collapse:collapse;font-size:13px;margin:0 14px}
.editor .bar{padding:0 14px}
.editor th{font-weight:600;color:var(--muted);text-align:center;padding:3px 6px;font-size:12.5px}.editor th:first-child{text-align:left}
.editor td{padding:3px 6px;border-bottom:1px solid var(--line-2)}
.editor td:first-child{min-width:230px}
.editor input.g{width:64px;text-align:center;font-variant-numeric:tabular-nums}
.editor input.nm{width:220px}
.editor input.typed{border-color:var(--place);box-shadow:inset 0 0 0 1px var(--place);background:var(--place-bg)}
.editor tr.tot td{font-weight:600;text-align:center;background:#F4F6F5}.editor tr.tot td:first-child{text-align:left}
.mini{font-size:12px;display:inline-flex;gap:4px;align-items:center}
.people li small{white-space:nowrap}
.edbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.edbar .grp{display:inline-flex;align-items:center;gap:2px;padding-right:8px;border-right:1px solid var(--line-2)}
.edbar .grp.end{border-right:0;margin-left:auto;padding-right:0}
.edbar .lbl{font-size:12px;color:var(--muted);margin-right:3px}
.edbar button{all:unset;box-sizing:border-box;min-width:28px;height:28px;padding:0 7px;border-radius:5px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.edbar button:hover{background:var(--place-bg)}
.edbar button:focus-visible{outline:2px solid var(--place);outline-offset:0}
.edbar button[disabled]{opacity:.35;cursor:not-allowed;background:none}
.edbar select{height:28px;padding:2px 4px;font-size:13px}
.swatch{position:relative;display:inline-flex;align-items:center;justify-content:center;width:28px;height:26px;border-radius:5px 5px 0 0;cursor:pointer;font-weight:700;border-bottom:3px solid #C0392B}
.swatch input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
.swatch.fill{border-bottom:0;border-radius:5px}.swatch.fill span{width:16px;height:16px;background:#D9D9D9;border:1px solid #777;display:block}
.swatch:hover{background:var(--place-bg)}
.page.edit .ed{outline:none;border-radius:2px;cursor:text;white-space:pre-wrap}
.page.edit .ed:hover{background:#EEF3FF}
.page.edit .ed:focus{background:#FFF6CF;box-shadow:0 0 0 1px #E0B25B}
.page.edit .ed:empty{display:inline-block;min-width:2.4em;min-height:1.15em;vertical-align:bottom;border-bottom:1px dashed #B9C3C2}
.page.edit .fld{background:var(--place-bg);color:#17367A;border-radius:3px;padding:0 3px;box-shadow:inset 0 0 0 1px var(--place-line)}
.page.edit .selp{box-shadow:-3px 0 0 var(--place)}
.page.edit td.selc{box-shadow:inset 0 0 0 2px var(--place)}
.page.edit tr.proto td:first-child{box-shadow:inset 4px 0 0 var(--data)}
.page.edit tr.proto td.selc:first-child{box-shadow:inset 4px 0 0 var(--data),inset 0 0 0 2px var(--place)}
.page.edit tr.ghost td{opacity:.38;pointer-events:none}
.sumrow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:6px 8px;margin:0;padding:8px 0;border-bottom:1px solid var(--line-2)}
.sumrow .lab{font-weight:600;align-self:center;overflow-wrap:anywhere}
.sumrow .more{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.editor td.c{text-align:center}
.editor input[type=checkbox].typed{outline:2px solid var(--place);outline-offset:1px}
#tplforms{min-width:0}
.rules{grid-template-columns:minmax(0,1fr)}
.rules section{min-width:0;overflow-x:auto}
#tplforms table{width:100%}
#tplforms td{padding-right:8px}
#tplforms td input[type=text],#tplforms td select{width:100%;min-width:0}
.tag{white-space:nowrap}
.mini{white-space:nowrap}
.pv.editing .pv-scroll{max-height:calc(100vh - 310px);min-height:320px}
.split>*,.gen>*{min-width:0}
@media (max-width:1100px){.split,.gen{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Steps">
    <div class="brand">Report Transcript Builder</div>
    <div class="brand-sub">RP1, RP2, RP3 and end grades, a row per subject</div>
    <ol class="steps" id="steps"></ol>
    <p class="private">Your files are read by this page on this computer. Nothing is uploaded or sent anywhere.</p>
  </nav>
  <main id="view" tabindex="-1"></main>
</div>
<input type="file" id="pick" multiple hidden accept=".xlsx,.xlsm,.docx">
<input type="file" id="pick2" hidden accept=".xlsx,.xlsm">

<script>/* ================================================================
   Transcript Builder — core: helpers, Excel reader/writer, processing
   ================================================================ */
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s ?? '').replace(/\s+/g, ' ').trim().toLowerCase();
const up = s => String(s ?? '').replace(/\s+/g, ' ').trim().toUpperCase();
const ERR_RE = /^#(N\/A|REF!|VALUE!|DIV\/0!|NAME\?|NULL!|NUM!)$/i;

/** Clean text from a cell: trims, drops Excel errors like #N/A. Dates pass through. */
function txt(v) {
  if (v == null) return '';
  if (v instanceof Date) return v;
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : String(v);
  const s = String(v).trim();
  return ERR_RE.test(s) ? '' : s;
}
/** Numeric value of a grade cell, or null. Text such as N/A, ME, AE is not a grade. */
function numOf(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (typeof v === 'string' && /^\s*-?\d+(\.\d+)?\s*$/.test(v)) return parseFloat(v);
  return null;
}
function maxOf(vals) {
  let m = null;
  for (const v of vals) { const n = numOf(v); if (n != null && (m == null || n > m)) m = n; }
  return m;
}
function normId(v, prefix) {
  if (v == null) return '';
  let s = typeof v === 'number' ? String(Math.round(v)) : String(v).trim();
  if (!s || s.startsWith('#')) return '';
  s = s.toUpperCase().replace(/\s+/g, '');
  const p = (prefix || '').toUpperCase();
  if (p && !s.startsWith(p)) s = p + s;
  return s;
}
const colLetter = n => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };

/* ---------------- dates ---------------- */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const pad2 = n => String(n).padStart(2, '0');
const DATE_FORMATS = [
  ['D MMMM YYYY', '12 March 2010'],
  ['DD/MM/YYYY', '12/03/2010'],
  ['DD-MMM-YYYY', '12-Mar-2010'],
  ['M/D/YYYY', '3/12/2010 (what Word mail merge prints)'],
  ['YYYY-MM-DD', '2010-03-12'],
];
function fmtDate(d, f) {
  const y = d.getUTCFullYear(), m = d.getUTCMonth(), day = d.getUTCDate();
  switch (f) {
    case 'DD/MM/YYYY': return `${pad2(day)}/${pad2(m + 1)}/${y}`;
    case 'DD-MMM-YYYY': return `${pad2(day)}-${MONTHS[m].slice(0, 3)}-${y}`;
    case 'M/D/YYYY': return `${m + 1}/${day}/${y}`;
    case 'YYYY-MM-DD': return `${y}-${pad2(m + 1)}-${pad2(day)}`;
    default: return `${day} ${MONTHS[m]} ${y}`;
  }
}
/** Word date picture (\@ "dd MMMM yyyy") */
function fmtDatePicture(d, pic) {
  const y = d.getUTCFullYear(), m = d.getUTCMonth(), day = d.getUTCDate(), wd = d.getUTCDay();
  return pic.replace(/'([^']*)'|dddd|ddd|dd|d|MMMM|MMM|MM|M|yyyy|yy/g, (t, lit) => {
    if (lit != null) return lit;
    switch (t) {
      case 'dddd': return DAYS[wd]; case 'ddd': return DAYS[wd].slice(0, 3);
      case 'dd': return pad2(day); case 'd': return String(day);
      case 'MMMM': return MONTHS[m]; case 'MMM': return MONTHS[m].slice(0, 3);
      case 'MM': return pad2(m + 1); case 'M': return String(m + 1);
      case 'yyyy': return String(y); case 'yy': return String(y).slice(-2);
    }
    return t;
  });

/* ================================================================

const W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';

}

  const tr = e.target.closest('#gridbody tr'); if (tr) { S.previewId = tr.dataset.id; S.step = 4; S.editorOpen = true; render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const act = el.dataset.act, s = student();
  if (act === 'step') { S.step = +el.dataset.n; render(); $('#view').focus({ preventScroll: true }); window.scrollTo(0, 0); }
  else if (act === 'pick') $('#pick').click();
  else if (act === 'pick2') $('#pick2').click();
  else if (act === 'rmfile') { S.sheets = S.sheets.filter(x => x.file !== el.dataset.name); S.files = S.files.filter(x => x !== el.dataset.name); if (!sheet()) { S.sheetId = null; S.cols = {}; } again(); }
  else if (act === 'tab') { S.tab = el.dataset.tab; render(); }
  else if (act === 'year') { const D = S.data, y = el.dataset.y, set = new Set(D.chosen); set.has(y) ? set.delete(y) : set.add(y); S.cfg.years = [...set]; S.selTouched = false; again(); }
  else if (act === 'entry') downloadEntry();
  else if (act === 'clearov') { if (confirm('Remove every typed and loaded value? The sheet values come back.')) { S.ov = {}; S.importNote = ''; again(); } }
  else if (act === 'tplmode') { Ed.flush(); S.tplMode = el.dataset.m; render(); }
  else if (act === 'dltpl') downloadTemplate();
  else if (act === 'gosubjects') { S.step = 2; S.tab = 'subjects'; render(); window.scrollTo(0, 0); }
  else if (act === 'addcol' || act === 'delcol' || act === 'addsum') {
    const T = S.tpl; if (!T) return; Ed.flush();
    const op = act === 'addcol' ? { t: 'coladd', tbl: T.subjTbl, g: T.nPeriods, after: true } : act === 'delcol' ? { t: 'coldel', tbl: T.subjTbl, g: +el.dataset.k + 1 } : { t: 'rowadd', tbl: T.subjTbl, r: T.nRows - 1, below: true, id: '7B' + (Date.now() % 0xFFFFFF).toString(16).toUpperCase().padStart(6, '0') };
    const why = Ed.host.guard(op); if (why) { toast(why); return; } pushOp(op, false);
  }
  else if (act === 'countall' || act === 'countlevel' || act === 'countnone') { for (const x of S.data.subjects.values()) { const o = S.cfg.subjects[x.key] || (S.cfg.subjects[x.key] = {}); o.count = act === 'countall' ? true : act === 'countnone' ? false : x.level; } again(); }
  else if (act === 'fullnames' || act === 'shortnames') { for (const x of S.data.subjects.values()) { const o = S.cfg.subjects[x.key] || (S.cfg.subjects[x.key] = {}); if (act === 'fullnames') o.display = fullNameFor(x.name); else delete o.display; } again(); }
  else if (act === 'selall' || act === 'selnone') { S.selTouched = true; for (const l of $$('#people li')) { if (l.hidden) continue; act === 'selall' ? S.sel.add(l.dataset.id) : S.sel.delete(l.dataset.id); } const keep = $('#people').scrollTop; S.lastDone = ''; S.editorOpen = !!($('details.editor') && $('details.editor').open); render(); $('#people').scrollTop = keep; }
  else if (act === 'create') createDocs(false);
  else if (act === 'createone') createDocs(true);
  else if (s && (act === 'exadd' || act === 'exdel' || act === 'ovreset')) {
    const o = S.ov[s.id] || (S.ov[s.id] = {});
    if (act === 'exadd') (o.extra || (o.extra = [])).push({ name: '', vals: {} }); else if (act === 'exdel') o.extra.splice(+el.dataset.x, 1); else delete S.ov[s.id];
    const keep = $('#people').scrollTop; S.editorOpen = true; compute(); save(); render(); $('#people').scrollTop = keep;
  }
});
document.addEventListener('change', async e => {
  const el = e.target, act = el.dataset && el.dataset.act; if (!act) return;
  const cfg = S.cfg, s = student(), keepList = fn => { const p = $('#people'), k = p ? p.scrollTop : 0; S.editorOpen = !!($('details.editor') && $('details.editor').open); fn(); const p2 = $('#people'); if (p2) p2.scrollTop = k; };

  else if (act === 'hrow') { S.headerRow = Math.max(1, +el.value || 1) - 1; S.cols = matchData(sheet().rows[S.headerRow] || []).cols; cfg.periods.forEach(p => p.src = null); again(); }
  else if (act === 'col') { S.cols[el.dataset.role] = el.value === '' ? null : +el.value; if (el.dataset.role === 'year') cfg.years = null; S.selTouched = false; again(); }
  else if (act === 'psrc') { cfg.periods[+el.dataset.k].src = el.value; again(); }
  else if (act === 'ptitle') { const k = +el.dataset.k, T = S.tpl, h = T && T.periodHead[k]; if (!T) { cfg.periods[k].title = el.value; again(); } else if (h) pushOp({ t: 'celltext', tbl: T.subjTbl, r: h.r, c: h.c, v: el.value }, false); else toast('This column has no heading cell in the template. Add a row above the subjects on the page first.'); }
  else if (act === 'cfg') { cfg[el.dataset.k] = el.value; again(); }
  else if (act === 'cfgn') { cfg[el.dataset.k] = Math.max(1, +el.value || 1); again(); }
  else if (act === 'cfgb') { cfg[el.dataset.k] = el.checked; again(); }
  else if (act === 'sname' || act === 'sshow' || act === 'scount') { const o = cfg.subjects[el.dataset.k] || (cfg.subjects[el.dataset.k] = {}); if (act === 'sname') o.display = el.value.trim(); else o[act === 'sshow' ? 'show' : 'count'] = el.checked; compute(); save(); renderRail(); }
  else if (act === 'bind') { S.bind[el.dataset.key] = el.value; save(); render(); }
  else if (act === 'text') { S.texts[el.dataset.key] = el.value; compute(); save(); render(); }
  else if (act === 'sumtype') { cfg.sumTypes[el.dataset.key] = el.value; again(); }
  else if (act === 'sumadd') { const r = S.tpl.sumRows.find(x => x.key === el.dataset.key), set = new Set(sumAdd(r)); el.checked ? set.add(el.dataset.row) : set.delete(el.dataset.row); cfg.sumAdd[r.key] = S.tpl.sumRows.map(x => x.key).filter(k => set.has(k)); again(); }
  else if (act === 'pvstudent') { S.previewId = el.value; render(); }
  else if (act === 'sel') { S.selTouched = true; el.checked ? S.sel.add(el.dataset.id) : S.sel.delete(el.dataset.id); S.lastDone = ''; $('#selcount').textContent = S.sel.size; const b = $('#createbtn'); b.textContent = `Create ${plural(S.sel.size, 'transcript')}`; b.disabled = !S.sel.size; renderRail(); }
  else if (act === 'mode') { S.out.mode = el.value; save(); keepList(render); }
  else if (act === 'pattern') { S.out.pattern = el.value.trim() || '{Surname}_{Forename}_{ID}'; save(); }
  else if (act === 'pform') { S.pform = el.value; filterPeople(); }
  else if (s && act === 'ov') { const sub = s.view.subs.find(x => x.key === el.dataset.sub), k = +el.dataset.k, v = el.value.trim(), same = v === (sub.src[k] || ''); setOv(s.id, 'g', sub.key, k, same ? null : v); el.classList.toggle('typed', !same); softRefresh(s); }
  else if (s && act === 'ovt') { setOv(s.id, 't', el.dataset.row, +el.dataset.k, el.value.trim()); el.classList.toggle('typed', el.value.trim() !== ''); softRefresh(s); }
  else if (s && act === 'ovc') { const info = S.data.subjects.get(el.dataset.sub); setOv(s.id, 'c', el.dataset.sub, null, el.checked === info.count ? null : el.checked); el.classList.toggle('typed', el.checked !== info.count); softRefresh(s); }
  else if (s && (act === 'exname' || act === 'exval' || act === 'excount')) { const x = S.ov[s.id].extra[+el.dataset.x]; if (act === 'exname') x.name = el.value.trim(); else if (act === 'exval') (x.vals || (x.vals = {}))[+el.dataset.k] = el.value.trim(); else x.count = el.checked; softRefresh(s); }
});
document.addEventListener('input', e => { const act = e.target.dataset && e.target.dataset.act; if (act === 'q') { S.q = e.target.value; filterGrid(); } else if (act === 'pq') { S.pq = e.target.value; filterPeople(); } });
$('#pick').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
$('#pick2').addEventListener('change', e => { if (e.target.files[0]) importEntry(e.target.files[0]); e.target.value = ''; });
for (const ev of ['dragenter', 'dragover']) document.addEventListener(ev, e => { if (![...(e.dataTransfer?.types || [])].includes('Files')) return; e.preventDefault(); const d = e.target.closest && e.target.closest('[data-drop]') || $('[data-drop]'); if (d) d.classList.add('over'); });
document.addEventListener('dragleave', e => { if (e.relatedTarget) return; $$('.over').forEach(x => x.classList.remove('over')); });
